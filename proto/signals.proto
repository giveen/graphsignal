syntax = "proto3";

package graphsignal.signals;

message UploadRequest {
  repeated Metric metrics = 1;
  repeated LogBatch log_batches = 2;
  repeated Resource resources = 3;
  int64 upload_ts = 4;
}

message UploadResponse {
}

message Tag {
  string key = 1;
  string value = 2;
}

message Metric {
  enum MetricType {
    UNDEFINED_METRIC = 0;
    GAUGE_METRIC = 1;
    COUNTER_METRIC = 2;
    // 3 was SUMMARY_METRIC. Histograms carry count/sum/min/max, so a summary
    // is a histogram with no bins; the number stays burned so a stored enum
    // value never changes meaning.
    reserved 3;
    HISTOGRAM_METRIC = 4;
    PROFILE_METRIC = 5;
  }
  string metric_id = 1;
  string name = 2;
  repeated Tag tags = 3;
  MetricType type = 4;
  repeated DataPoint datapoints = 5;
  repeated ProfileFrame frames = 6;
}

message DataPoint {
  // Bins and the exact aggregates are independent: a producer with only
  // buckets (Prometheus histogram) sends both, one with only totals
  // (Prometheus summary) sends the aggregates alone, and quantiles are then
  // unavailable rather than estimated. `optional` so an absent aggregate is
  // distinguishable from a measured zero.
  message Histogram {
    repeated double bins = 1;
    repeated int64 counts = 2;
    optional int64 count = 3;
    optional double sum = 4;
    // Extremes over the instrument's whole life, NOT over this datapoint's
    // interval: they are read from cumulative instruments that never reset,
    // and no delta of two cumulative extremes is the interval's extreme.
    optional double min = 5;
    optional double max = 6;
  }
  message Profile {
    repeated uint64 frame_ids = 1;
    repeated uint64 values = 2;
    repeated uint64 samples = 3;
  }
  reserved 3;  // was Summary summary
  oneof value {
    double gauge = 1;
    double total = 2;
    Histogram histogram = 4;
    Profile profile = 5;
  }
  int64 measurement_ts = 10;
}

message ProfileFrame {
  uint64 frame_id = 1;
  string name = 2;
}

message LogBatch {
  repeated Tag tags = 1;
  repeated LogEntry log_entries = 2;
}

message LogEntry {
  enum LogLevel {
    UNSPECIFIED_LEVEL = 0;
    TRACE_LEVEL = 5;
    DEBUG_LEVEL = 10;
    INFO_LEVEL = 20;
    WARNING_LEVEL = 30;
    ERROR_LEVEL = 40;
    CRITICAL_LEVEL = 50;
  }
  string entry_ts = 1;
  LogLevel level = 2;
  string message = 3;
  string exception = 4;
  int64 log_ts = 5;
}

message Resource {
  string resource_id = 1;
  string kind = 2;
  repeated Tag tags = 3;
  repeated Attribute attributes = 4;
  int64 first_seen_ts = 5;
  int64 last_seen_ts = 6;
}

message Attribute {
  string name = 1;
  string value = 2;
}